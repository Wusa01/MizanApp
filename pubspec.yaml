name: mizan
description: "Mizan - Personal and Business Finance Manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1

  # State Management
  flutter_riverpod: ^3.5.0

  # Navigation
  go_router: ^18.1.4

  # Database
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Charts
  fl_chart: ^1.3.1

  # Formatting
  intl: ^0.20.3

  # PDF
  pdf: ^3.13.1
  printing: ^5.15.1

  # CSV
  csv: ^8.0.0

  # File Handling
  file_picker: ^13.4.0

  # Preferences
  shared_preferences: ^2.5.6
  local_auth: ^3.0.2
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift Code Generation
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
